# ==========================================================
# WINDOW & LAYER RULES
# ==========================================================

# --- Opacity Rules ---
# Syntax: opacity <active> <inactive> <fullscreen>
windowrulev2 = opacity 0.70 0.70 1.0, class:^(firefox|zen|brave-browser|com\.github\.rafostar\.Clapper)$
windowrulev2 = opacity 0.80 0.80 1.0, class:^(code-oss|Code|code-url-handler|code-insiders-url-handler|kitty|org\.kde\.dolphin|org\.kde\.ark|nwg-look|qt5ct|qt6ct|kvantummanager|com\.github\.tchx84\.Flatseal|hu\.kramo\.Cartridges|com\.obsproject\.Studio|gnome-boxes|vesktop|discord|WebCord|ArmCord|app\.drey\.Warp|net\.davidotek\.pupgui2|yad|Signal|io\.github\.alainm23\.planify|io\.gitlab\.theevilskeleton\.Upscaler|com\.github\.unrud\.VideoDownloader|io\.gitlab\.adhami3310\.Impression|io\.missioncenter\.MissionCenter|io\.github\.flattool\.Warehouse)$
windowrulev2 = opacity 0.80 0.70 1.0, class:^(org\.pulseaudio\.pavucontrol|blueman-manager|nm-applet|nm-connection-editor|org\.kde\.polkit-kde-authentication-agent-1|polkit-gnome-authentication-agent-1|org\.freedesktop\.impl\.portal\.desktop\.gtk|org\.freedesktop\.impl\.portal\.desktop\.hyprland)$
windowrulev2 = opacity 0.70 0.70 1.0, class:^(Steam|steamwebhelper|Spotify)$
windowrulev2 = opacity 0.70 0.70 1.0, initialTitle:^(Spotify Free|Spotify Premium)$

# --- Floating Rules ---
windowrulev2 = float, class:^(Signal|com\.github\.rafostar\.Clapper|app\.drey\.Warp|net\.davidotek\.pupgui2|yad|eog|io\.github\.alainm23\.planify|io\.gitlab\.theevilskeleton\.Upscaler|com\.github\.unrud\.VideoDownloader|io\.gitlab\.adhami3310\.Impression|io\.missioncenter\.MissionCenter|org\.gnome\.Polkit-gnome-authentication-agent-1|pavucontrol|nm-connection-editor)$
windowrulev2 = float, title:^(Friends List|Steam Settings|Picture-in-Picture|File Operation Progress|Confirm to replace files)$

# --- Specific Application Behaviors ---
# Xwaylandvideobridge: hide the black screen-share helper window
windowrulev2 = opacity 0.0 override, class:^(xwaylandvideobridge)$
windowrulev2 = noanim, class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus, class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1, class:^(xwaylandvideobridge)$
windowrulev2 = noblur, class:^(xwaylandvideobridge)$

# Picture-in-Picture
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = size 25% 25%, title:^(Picture-in-Picture)$

# System Menus
windowrulev2 = size 800 600, class:^(pavucontrol|nm-connection-editor)$

# JetBrains IDE Dropdown Workaround
windowrulev2 = noinitialfocus, class:^(jetbrains-.*), title:^(win.*)$

# Idle Inhibitors (Keep screen awake during videos)
windowrulev2 = idleinhibit fullscreen, class:^(firefox|brave-browser|zen|mpv|vlc)$

# ==========================================================
# LAYER RULES (The Glass UI)
# ==========================================================
layerrule = blur, rofi
layerrule = ignorealpha 0.1, rofi

layerrule = blur, logout_dialog
layerrule = ignorealpha 0.1, logout_dialog

# --- HyprPanel UI ---
layerrule = blur, bar-0
layerrule = ignorealpha 0.1, bar-0

layerrule = blur, dashboardmenu
layerrule = ignorealpha 0.1, dashboardmenu

layerrule = blur, notificationsmenu
layerrule = ignorealpha 0.1, notificationsmenu

layerrule = blur, audiomenu
layerrule = ignorealpha 0.1, audiomenu

layerrule = blur, bluetoothmenu
layerrule = ignorealpha 0.1, bluetoothmenu

# Cloudflare WARP GUI: keep it from locking the desktop
windowrulev2 = float, class:^(cloudflare.?warp|warp.?taskbar|com\.cloudflare\.Warp.*)$
windowrulev2 = workspace special silent, class:^(cloudflare.?warp|warp.?taskbar|com\.cloudflare\.Warp.*)$
windowrulev2 = noinitialfocus, class:^(cloudflare.?warp|warp.?taskbar|com\.cloudflare\.Warp.*)$
windowrulev2 = workspace special silent, title:^(Cloudflare One Client)$
windowrulev2 = noinitialfocus, title:^(Cloudflare One Client)$
