# ==========================================================
# VISUALS & EFFECTS 
# ==========================================================

# --- General Layout & Borders ---
general {
    gaps_in = 4
    gaps_out = 10
    border_size = 1       # Thinner border (Reduced from 2 to 1)
    
    # A sleek, modern silver-grey for the active window
    col.active_border = rgba(a6adc8ff) 
    col.inactive_border = rgba(313244ff) 
    
    layout = dwindle
    resize_on_border = true
}

# --- Tiling Mechanics ---
dwindle {
    pseudotile = true     
    preserve_split = true 
}

master {
    new_status = master
}

# --- Glassmorphism & Shadows ---
decoration {
    rounding = 10
    active_opacity = 0.95

    # Lighter Glass Effect 
    blur {
        enabled = true
        size = 4              
        passes = 2            
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }

    # Shadows completely disabled for maximum minimalism
    shadow {
        enabled = false       # Turned off entirely!
    }
}
