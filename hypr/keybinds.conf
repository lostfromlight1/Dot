# ==========================================
#      KEYBINDINGS & HARDWARE SWITCHES
# ==========================================
$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$browser = firefox
# --- 🚀 CORE SHORTCUTS ---
bind = $mainMod, Return, exec, $terminal 
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, Space, exec, ~/.config/scripts/rofilaunch.sh d       
bind = $mainMod, V, exec, ~/.config/scripts/cliphist.sh c             
bind = $mainMod, W, exec, ~/.config/scripts/wallpicker.sh             
bind = $mainMod SHIFT, W, exec, ~/.config/scripts/swwwallpaper.sh -n  
bind = $mainMod, Escape, exec, ~/.config/scripts/logoutlaunch.sh      
bind = $mainMod SHIFT, S, exec, ~/.config/scripts/screenshot.sh area
bind = , Print, exec, ~/.config/scripts/screenshot.sh full

# ==========================================
# HYPRPANEL MENUS
# ==========================================
bind = SUPER, D, exec, hyprpanel t dashboardmenu
bind = SUPER, N, exec, hyprpanel t notificationsmenu

# --- 💻 LAPTOP LID SWITCH ---
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on
bindl = , switch:on:Lid Switch, exec, loginctl lock-session && systemctl suspend

# --- 🪟 WINDOW MANAGEMENT ---
bind = $mainMod, Q, killactive,         
bind = $mainMod, F, fullscreen,         
bind = $mainMod, T, togglefloating,     
bind = $mainMod, P, pseudo,             
bind = $mainMod, J, togglesplit,        

# --- 🔄 WINDOW CYCLING ---
bind = $mainMod, Tab, cyclenext,           
bind = $mainMod, Tab, bringactivetotop,    
bind = $mainMod SHIFT, Tab, cyclenext, prev
bind = $mainMod SHIFT, Tab, bringactivetotop,

# --- 🎯 VIM-STYLE FOCUS ---
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# --- 📂 WORKSPACE NAVIGATION ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# --- 🖱️ MOUSE CONTROLS ---
bindm = $mainMod, mouse:272, movewindow   # Left Click
bindm = $mainMod, mouse:273, resizewindow # Right Click

binde = $mainMod SHIFT, right, resizeactive, 30 0
binde = $mainMod SHIFT, left, resizeactive, -30 0
binde = $mainMod SHIFT, up, resizeactive, 0 -30
binde = $mainMod SHIFT, down, resizeactive, 0 30

# --- 🔊 MEDIA & AUDIO ---
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = ,XF86AudioPlay, exec, playerctl play-pause 
bindl  = ,XF86AudioNext, exec, playerctl next
bindl  = ,XF86AudioPrev, exec, playerctl previous

# --- 💡 BRIGHTNESS ---
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindel = ,XF86KbdBrightnessUp, exec, brightnessctl -d *::kbd_backlight set 33%+
bindel = ,XF86KbdBrightnessDown, exec, brightnessctl -d *::kbd_backlight set 33%-
