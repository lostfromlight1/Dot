# ==========================================================
# HYPRLOCK (Catppuccin Mocha + Glass Layout)
# ==========================================================
source = ~/.config/hypr/theme/mocha.conf

# --- BACKGROUND ---
background {
    monitor =
    path = ~/Pictures/Wallpapers/1-everforest.jpg
    blur_passes = 2
    blur_size = 5
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# --- GENERAL ---
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# --- MAIN GLASS BOX ---
shape {
    monitor =
    size = 500, 500
    color = rgba(30, 30, 46, 0.6) 
    rounding = 30
    border_size = 2
    border_color = $mauve
    rotate = 0
    xray = false 
    position = 0, -70
    halign = center
    valign = center
}

# --- PROFILE PHOTO ---
image {
    monitor =
    path = ~/Pictures/Pfps/Miku.jpg
    border_size = 2
    border_color = $mauve
    size = 100
    rounding = -1
    rotate = 0
    reload_time = -1
    position = 0, 170
    halign = center
    valign = center
}

# --- GREETING ---
label {
    monitor =
    text = Hi, $USER
    color = $text
    font_size = 20
    font_family = JetBrainsMono Nerd Font 
    position = 0, 80
    halign = center
    valign = center
}

# --- TIME ---
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 60
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -20
    halign = center
    valign = center
}

# --- DATE ---
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = $subtext0
    font_size = 19
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -90
    halign = center
    valign = center
}

# --- INNER USERNAME BOX ---
shape {
    monitor =
    size = 320, 55
    color = rgba(255, 255, 255, 0.05)
    rounding = -1
    border_size = 1
    border_color = rgba(255, 255, 255, 0.2)
    position = 0, -190
    halign = center
    valign = center
}

# --- USERNAME ICON & TEXT ---
label {
    monitor =
    text =     $USER
    color = $text
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -190
    halign = center
    valign = center
}

# --- PASSWORD INPUT FIELD ---
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    dots_size = 0.2 
    dots_spacing = 0.2 
    dots_center = true
    
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = $text
    check_color = $green
    fail_color = $red
    
    fade_on_empty = false
    placeholder_text = <i><span foreground="##cdd6f499">   Enter Password</span></i>
    hide_input = false
    position = 0, -268
    halign = center
    valign = center
}
