# ==========================
# CORE SETTINGS
# ==========================
set-option -g default-shell /usr/bin/fish

# Fix Colors & Enable Images for Kitty
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-kitty:RGB"
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g prefix C-s
unbind C-b
bind C-s send-prefix

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ==========================
# PANE SPLITTING
# ==========================
# Basic splits (Ctrl+Enter is unreliable in tmux, use these instead)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ==========================
# VIM NAVIGATION
# ==========================
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# ==========================
# PLUGINS
# ==========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'catppuccin/tmux#v0.3.0'

# Catppuccin Config (v0.3.0 Style)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"

# 🚨 FIX: Changed from "" to "null" to prevent the module warning
set -g @catppuccin_status_modules_right "null"

# Force Catppuccin to use native terminal transparency
set -g @catppuccin_status_background "default"

set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# Status Bar Position
set -g status-position top

# Transparency Fixes
set -g status-style bg=default
set -g status-bg default

# Initialize TPM (Keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
