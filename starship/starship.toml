$time"""

continuation_prompt = '▶▶ '

[directory]
disabled = false
format = "[$path](bold fg:#89b4fa)"
truncate_to_repo = false

[git_branch]
format = " [  $branch](fg:#cba6f7)"

[git_status]
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
format = '[[( $all_status$ahead_behind )](fg:#f38ba8)]($style)'
style = "bg:#313244"

[time]
disabled = false
format = '[[  $time ](fg:#b4befe)]($style)'
time_format = "%R"

[deno]
format = " [deno](italic fg:#a6adc8) [ ](bold fg:#a6e3a1)"
version_format = "${raw}"

[lua]
format = " [lua](italic fg:#a6adc8) [${symbol}]($style)"
style = "bold fg:#f9e2af"
symbol = "⨀ "
version_format = "${raw}"

[nodejs]
detect_extensions = []
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
format = "[ ](bold fg:#a6e3a1)"
version_format = "${raw}"

[python]
format = "[${symbol}(${virtualenv}) ${version}]($style)"
style = "bold fg:#f9e2af"
symbol = "[ ](bold fg:#89b4fa)"
version_format = "${raw}"

[ruby]
format = " [rb](italic fg:#a6adc8) [${symbol}]($style)"
style = "bold fg:#f38ba8"
symbol = " "
version_format = "${raw}"

[rust]
style = "bold fg:#f38ba8"
format = " rs(italic fg:#a6adc8) $symbol($style)"
symbol = " "

[swift]
format = " [sw](italic fg:#a6adc8) [${symbol}]($style)"
style = "bold fg:#f38ba8"
symbol = " "
version_format = "${raw}"

[aws]
disabled = true
format = " [aws](italic fg:#a6adc8) [$symbol $profile $region]($style)"
style = "bold fg:#89b4fa"
symbol = " "

[buf]
style = "bold fg:#f38ba8"
format = " [buf](italic fg:#a6adc8) [$symbol $buf_version]($style)"
symbol = "■ "

[c]
style = "bold fg:#89dceb"
format = " [$symbol(-$name)]($style)"
symbol = "ℂ "

[cpp]
style = "bold fg:#89dceb"
format = " [cpp](italic fg:#a6adc8) [$symbol]($style)"
symbol = " "

[kotlin]
format = " [kotlin](italic fg:#a6adc8) [$symbol]($style)"
style = "bold fg:#f38ba8"
symbol = " "

[ocaml]
